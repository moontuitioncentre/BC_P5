  <style>
    body {
      margin: 0;
      font-family: "Noto Sans SC", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; background-color: #f0f0f0;
    }
    .container {
      text-align: center; padding: 20px; background: #fff; border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,.1); max-width: 720px; width: 92%;
    }
    .question { font-size: 28px; margin-bottom: 10px; }
    .word { font-size: 34px; margin-bottom: 16px; }
    .btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: center;
  align-items: center;
  margin-top: 15px;
  margin-bottom: 14px;
}

.btn-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.search-box {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 15px;
}

.search-box input {
  font-size: 18px;
  padding: 8px 12px;
  width: 180px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.btn.search-btn {
  background-color: #008cff;
}

.pinyin {
  font-size: 18px;
  color: #555;
  margin-top: -5px;
  margin-bottom: 25px;
  font-style: italic;
}

    .btn {
      font-size: 18px; padding: 10px 20px; border: none; border-radius: 8px;
      background-color: #dc3545; color: #fff; cursor: pointer;
    }
    .btn.secondary { background-color: #6c757d; }
    .btn.info { background-color: #dc3545; }
    .btn.success { background-color: #dc3545; }
    .btn.warning { background-color: #ffc107; color: #000; }
    .meaning {
      margin-top: 10px; font-size: 20px; background: #f8f9fa; border-radius: 8px;
      padding: 12px; min-height: 60px; line-height: 1.6; white-space: pre-wrap;
    }

.test-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

.test-btn {
  font-size: 18px;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

.reading-btn {
  background-color: #007bff;
}

.meaning-btn {
  background-color: #28a745;
}

.test-btn:hover {
  opacity: 0.85;
}

.set-selector {
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 18px;
}

.set-selector select {
  font-size: 18px;
  padding: 8px 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
}

  </style>
</head>

    <div class="set-selector">

    </div>

    <div class="search-box">
  <input

  >

    class="btn search-btn"

    Search
  </button>
</div>

      <div class="btn-row">

      </div>

    <div class="meaning" id="meaning"></div>

</div>

    function setMeaning(text) { meaningDiv.textContent = text || ''; }

    // 统一的朗读函数（默认：慢速 0.4、音高 0.6）
    function speak(text, lang, preferNames = [], rate = 0.4, pitch = 0.6) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = rate;
      u.pitch = pitch;

      const trySpeak = () => {
        const voices = speechSynthesis.getVoices() || [];
        let candidates = voices.filter(v => (v.lang || '').toLowerCase().startsWith(lang.toLowerCase()));
        // 如果没有马来语，回退印尼语
        if (!candidates.length && lang.toLowerCase().startsWith('ms')) {
          candidates = voices.filter(v => (v.lang || '').toLowerCase().startsWith('id'));
          if (candidates.length) u.lang = 'id-ID';
        }
        for (const key of preferNames) {
          const found = candidates.find(v => (v.name || '').toLowerCase().includes(key.toLowerCase()));
          if (found) { u.voice = found; break; }
        }
        if (!u.voice && candidates.length) u.voice = candidates[0];
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      };

      if (speechSynthesis.getVoices().length === 0) {
        speechSynthesis.onvoiceschanged = trySpeak;
      }
      trySpeak();
    }

function searchWord() {

  const keyword = document.getElementById("searchInput").value.trim();

  if (!keyword) {
    alert("请输入要搜索的词语");
    return;
  }


  const index = activeSet.zh.indexOf(keyword);


  if (index !== -1) {

    currentIndex = index;
    updateQuestion();

  } else {

    alert("没有找到：" + keyword);

  }

}
